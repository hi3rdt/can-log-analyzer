# OpenOCD config: ST-Link V2 (or clone) + STM32F103C8 Blue Pill, SWD.
#   openocd -f tools/openocd/bluepill.cfg -c "program build-fw/firmware.elf verify reset exit"

source [find interface/stlink.cfg]

# Many Blue Pills carry a clone MCU (CKS32F103, CS32F103, APM32F103) whose SWD
# IDCODE (e.g. 0x2ba01477) differs from the genuine STM32 (0x1ba01477).
# 0 = accept any IDCODE instead of failing with "UNEXPECTED idcode".
set CPUTAPID 0

source [find target/stm32f1x.cfg]

# Cheap ST-Link clones usually have no NRST wire to the Blue Pill:
# reset through the core (SYSRESETREQ) instead of the reset pin.
reset_config none
